version: "3"

vars:
  CAPTURE_DIR: ./projects/capture
  BINARY: capture

tasks:
  build:
    desc: Build capture binary
    dir: "{{.CAPTURE_DIR}}"
    cmds:
      - go build -o {{.BINARY}} .
    sources:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    generates:
      - "{{.BINARY}}"

  install:
    desc: Install capture to GOPATH
    dir: "{{.CAPTURE_DIR}}"
    cmds:
      - go install .

  test:
    desc: Run all tests
    dir: "{{.CAPTURE_DIR}}"
    cmds:
      - go test ./... -v

  test-coverage:
    desc: Run tests with coverage report
    dir: "{{.CAPTURE_DIR}}"
    cmds:
      - go test ./... -coverprofile=coverage.out
      - go tool cover -html=coverage.out -o coverage.html

  clean:
    desc: Remove build artifacts
    dir: "{{.CAPTURE_DIR}}"
    cmds:
      - rm -f {{.BINARY}} coverage.out coverage.html

  fmt:
    desc: Format Go source files
    dir: "{{.CAPTURE_DIR}}"
    cmds:
      - gofmt -w .

  lint:
    desc: Run golangci-lint
    dir: "{{.CAPTURE_DIR}}"
    cmds:
      - golangci-lint run

  run:
    desc: Build and run capture kanban
    deps: [build]
    dir: "{{.CAPTURE_DIR}}"
    cmds:
      - ./{{.BINARY}} kanban

  run-idea:
    desc: Build and run capture idea list
    deps: [build]
    dir: "{{.CAPTURE_DIR}}"
    cmds:
      - ./{{.BINARY}} idea list
