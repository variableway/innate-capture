version: "3"

vars:
  BINARY: capture
  LOCAL_BIN: '{{.HOME}}/.local/bin'

tasks:
  build:
    desc: Build capture binary
    cmds:
      - go build -o {{.BINARY}} .
    sources:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
    generates:
      - "{{.BINARY}}"

  install:
    desc: Install capture binary to ~/.local/bin
    env:
      GOBIN: '{{.LOCAL_BIN}}'
    cmds:
      - go install .

  test:
    desc: Run all tests
    cmds:
      - go test ./... -v

  test-coverage:
    desc: Run tests with coverage report
    cmds:
      - go test ./... -coverprofile=coverage.out
      - go tool cover -html=coverage.out -o coverage.html

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}} coverage.out coverage.html

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  run:
    desc: Build and run capture kanban
    deps: [build]
    cmds:
      - ./{{.BINARY}} kanban

  run-idea:
    desc: Build and run capture idea list
    deps: [build]
    cmds:
      - ./{{.BINARY}} idea list
